[package]
name = "anabolic"
description = "Performance monitoring and diagnostics for Windows and Linux: Task Manager on steroids"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
anabolic-core.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
arc-swap.workspace = true
# The MCP server (the MCP page): Streamable HTTP on 127.0.0.1, on a tokio
# runtime of its own, off unless turned on.
rmcp = { version = "3.5", features = ["transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
# glow: OpenGL, only for GPUs without a Direct3D 12 driver on Windows, and
# what draws on Linux (see renderer() in main.rs).
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wgpu_no_default_features"] }
egui_extras = { version = "0.36", default-features = false }

[target.'cfg(windows)'.dependencies]
# Direct3D 12 only: see wgpu_options in main.rs.
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "x11"] }
# Vulkan, when OpenGL cannot draw: see renderer() in main.rs.
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Without a window on Wayland (see linux/windowless.rs): which display the
# window is on, and eframe's saved state written without it.
raw-window-handle = "0.6"
ron = "0.12"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
