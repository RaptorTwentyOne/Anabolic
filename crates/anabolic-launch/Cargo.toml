[package]
name = "anabolic-launch"
description = "Started instead of Task Manager; brings up Anabolic"
version = "0.1.0"
edition = "2024"

# Built by crates/anabolic/build.rs and embedded into anabolic.exe, so it is a
# workspace of its own: small, no shared dependencies, its own target dir.
[workspace]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
