name: Release

# Pushing a tag such as v0.1.0 builds anabolic.exe, its installer and the
# Linux executable and puts them, with the licenses and the third-party
# notices, on one draft release to look over before publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo install cargo-about --locked --features cli --version 0.9.2
      - run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html
      # Sign target/release/anabolic.exe here once there is a code signing
      # certificate: unsigned, SmartScreen warns on every download.
      - name: Package
        shell: pwsh
        run: |
          $name = "anabolic-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/anabolic.exe, README.md, PRIVACY.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.html $name
          Copy-Item crates/anabolic/assets/fonts/OFL.txt "$name/OFL-Aldrich.txt"
          Compress-Archive $name "$name.zip"
      # The installer, from the same files (see installer/anabolic.wixproj).
      # Installed copies update through it, so it has to be on every release
      # from now on.
      - name: Installer
        shell: pwsh
        run: |
          $name = "anabolic-$env:GITHUB_REF_NAME-windows-x64"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          dotnet build installer -c Release "-p:ProductVersion=$version" "-p:BinDir=$PWD/$name" -o msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item msi/anabolic.msi "$name.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            anabolic-*.zip
            anabolic-*.msi
          if-no-files-found: error

  linux:
    # The oldest runner: the executable then needs no newer C library than
    # Ubuntu 22.04's (glibc 2.35), which every current distribution has.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo install cargo-about --locked --features cli --version 0.9.2
      - run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html
      # A zip like Windows', which the built-in updater unpacks; the
      # .desktop file and icon go in place with ./anabolic --install.
      - name: Package
        run: |
          name="anabolic-$GITHUB_REF_NAME-linux-x64"
          mkdir "$name"
          cp target/release/anabolic README.md PRIVACY.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.html "$name"
          cp crates/anabolic/assets/fonts/OFL.txt "$name/OFL-Aldrich.txt"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: anabolic-*.zip
          if-no-files-found: error

  # One draft, made once both zips exist. Two jobs making their own could
  # race into two drafts, or leave a draft with one zip: published, a
  # release without the Windows zip has every installed copy failing its
  # update check, since the updater looks for that file.
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The release's notes are its part of CHANGELOG.md, the same text the
      # app shows as What's new; a tag without one is not released.
      - name: Notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "title=Anabolic $version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no part for $version" >&2
            exit 1
          fi
          cat >> notes.md <<'EOF'

          > [!NOTE]
          > This release is not code-signed yet, so Windows SmartScreen may warn on first run: choose **More info** → **Run anyway**, or build it from source. On PCs with Smart App Control on, Windows blocks unsigned programs outright.
          EOF
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            dist/anabolic-*-windows-x64.msi
            dist/anabolic-*-windows-x64.zip
            dist/anabolic-*-linux-x64.zip
