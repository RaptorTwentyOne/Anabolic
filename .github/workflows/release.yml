name: Release

# Pushing a tag such as v0.1.0 builds anabolic.exe and puts it, with the
# licenses and the third-party notices, on a draft release to look over
# before publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo install cargo-about --locked --features cli --version 0.9.2
      - run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html
      # Sign target/release/anabolic.exe here once there is a code signing
      # certificate: unsigned, SmartScreen warns on every download.
      - name: Package
        shell: pwsh
        run: |
          $name = "anabolic-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/anabolic.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.html $name
          Copy-Item crates/anabolic/assets/fonts/OFL.txt "$name/OFL-Aldrich.txt"
          Compress-Archive $name "$name.zip"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: anabolic-*.zip
