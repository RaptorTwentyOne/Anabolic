name: Release

# Pushing a tag such as v0.1.0 builds anabolic.exe and the Linux executable
# and puts both, with the licenses and the third-party notices, on one draft
# release to look over before publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo install cargo-about --locked --features cli --version 0.9.2
      - run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html
      # Sign target/release/anabolic.exe here once there is a code signing
      # certificate: unsigned, SmartScreen warns on every download.
      - name: Package
        shell: pwsh
        run: |
          $name = "anabolic-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/anabolic.exe, README.md, PRIVACY.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.html $name
          Copy-Item crates/anabolic/assets/fonts/OFL.txt "$name/OFL-Aldrich.txt"
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: anabolic-*.zip
          if-no-files-found: error

  linux:
    # The oldest runner: the executable then needs no newer C library than
    # Ubuntu 22.04's (glibc 2.35), which every current distribution has.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo install cargo-about --locked --features cli --version 0.9.2
      - run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html
      # A zip like Windows', which the built-in updater unpacks; the
      # .desktop file and icon go in place with ./anabolic --install.
      - name: Package
        run: |
          name="anabolic-$GITHUB_REF_NAME-linux-x64"
          mkdir "$name"
          cp target/release/anabolic README.md PRIVACY.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.html "$name"
          cp crates/anabolic/assets/fonts/OFL.txt "$name/OFL-Aldrich.txt"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: anabolic-*.zip
          if-no-files-found: error

  # One draft, made once both zips exist. Two jobs making their own could
  # race into two drafts, or leave a draft with one zip: published, a
  # release without the Windows zip has every installed copy failing its
  # update check, since the updater looks for that file.
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/anabolic-*-windows-x64.zip
            dist/anabolic-*-linux-x64.zip
